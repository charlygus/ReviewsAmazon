<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Reviews</title>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { font-family: sans-serif; background-color: #ffffff; padding: 15px; max-width: 600px; margin: 0 auto; padding-bottom: 50px; user-select: none; }
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #ddd; }
        .tab { flex: 1; padding: 12px 5px; text-align: center; cursor: pointer; font-weight: bold; color: #666; background: #f8f9fa; border-radius: 8px 8px 0 0; border: 1px solid #ddd; border-bottom: none; font-size: 14px; }
        .tab.active { background: #007bff; color: white; border-color: #007bff; }
        .form-section { display: none; padding: 10px 5px; }
        .form-section.active { display: block; }
        .grupo-input { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input, textarea, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; background-color: #f9f9f9; user-select: text !important; }
        .scanner-box { background: #f0f4ff; border: 2px dashed #007bff; border-radius: 10px; padding: 15px; text-align: center; margin-bottom: 20px; }
        .botones { display: flex; gap: 10px; margin-top: 25px; }
        button { flex: 1; padding: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; color: white; }
        .btn-guardar { background-color: #28a745; }
        .btn-reset { background-color: #6c757d; flex: 0.4; }
        .card { background: white; border-radius: 10px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); border-left: 6px solid #ccc; }
        .card.pendiente { border-left-color: #ff9800; } 
        .card.esperando-pago { border-left-color: #17a2b8; } 
        .card.pagado { border-left-color: #28a745; } 
        .badge { display: inline-block; padding: 3px 6px; font-size: 10px; border-radius: 4px; color: white; margin-left: 5px; }
        .bg-ok { background: #28a745; } .bg-wait { background: #ff9800; } .bg-pay { background: #17a2b8; }
    </style>
</head>
<body>
    <div class="tabs">
        <div class="tab active" onclick="cambiarModo('nuevo')">1. ALTA</div>
        <div class="tab" onclick="cambiarModo('actualizar')">2. REVIEW</div>
        <div class="tab" onclick="cambiarModo('listado')">3. LISTADO</div>
    </div>

    <div id="form-nuevo" class="form-section active">
        <div class="scanner-box">
            <p style="font-weight: bold; color: #0056b3;">📷 Escáner Pro (Google AI)</p>
            <input type="file" id="input-imagen" accept="image/*" style="display: none;" onchange="procesarImagenPro(this)">
            <button onclick="document.getElementById('input-imagen').click()" style="background: #007bff; padding: 8px 15px; width: auto;">Subir Captura</button>
            <p id="estado-ocr" style="font-size: 12px; color: #666; display: none;">⏳ Analizando...</p>
        </div>
        <div class="grupo-input"><label>Producto:</label><input type="text" id="n_nombre"></div>
        <div class="grupo-input"><label>Nº Pedido:</label><input type="text" id="n_pedido"></div>
        <div class="grupo-input">
            <label>Vendedor:</label>
            <select id="sel_vendedores" onchange="verificarVendedorManual()"><option value="">Cargando...</option></select>
            <input type="text" id="n_contacto_manual" style="display:none; margin-top:10px;">
        </div>
        <div class="grupo-input"><label>Precio:</label><input type="number" step="0.01" id="n_precio"></div>
        <div class="grupo-input"><label>Notas:</label><textarea id="n_notas"></textarea></div>
        <div class="botones">
            <button class="btn-reset" onclick="limpiarCampos('nuevo')">Borrar</button>
            <button class="btn-guardar" onclick="enviarNuevo()">Guardar</button>
        </div>
    </div>

    <div id="form-actualizar" class="form-section">
        <div class="grupo-input"><label>Nº Pedido:</label><input type="text" id="a_pedido"></div>
        <div class="grupo-input"><label>Fecha Review:</label><input type="date" id="a_fecha"></div>
        <div class="grupo-input"><label>URL Review:</label><input type="url" id="a_url_review"></div>
        <div class="botones"><button class="btn-guardar" onclick="enviarActualizacion()">Actualizar</button></div>
    </div>

    <div id="form-listado" class="form-section"><div id="contenedor-tarjetas"></div></div>
    <p id="mensaje" style="text-align:center; font-weight:bold;"></p>

    <script>
        var scriptURL = "TU_URL_AQUI"; 

        function cambiarModo(m) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(f => f.classList.remove('active'));
            if(m=='listado') cargarListado();
            event.currentTarget.classList.add('active');
            document.getElementById('form-'+m).classList.add('active');
        }

        function procesarImagenPro(input) {
            if (input.files && input.files[0]) {
                var file = input.files[0];
                var estado = document.getElementById("estado-ocr");
                estado.style.display = "block"; estado.innerText = "⏳ Analizando con Google AI...";
                var reader = new FileReader();
                reader.onload = function(e) {
                    var datos = new FormData();
                    datos.append("accion", "ocr_drive");
                    datos.append("mimetype", file.type);
                    datos.append("imagen", e.target.result);
                    fetch(scriptURL, { method: 'POST', body: datos }).then(r => r.json()).then(res => {
                        estado.style.display = "none";
                        if(res.pedido) document.getElementById("n_pedido").value = res.pedido;
                        if(res.precio) document.getElementById("n_precio").value = res.precio;
                        if(res.nombre) document.getElementById("n_nombre").value = res.nombre;
                    });
                };
                reader.readAsDataURL(file);
            }
        }

        function cargarListado() {
            var cont = document.getElementById("contenedor-tarjetas");
            cont.innerHTML = "Cargando...";
            var d = new FormData(); d.append("accion", "leer");
            fetch(scriptURL, { method: 'POST', body: d }).then(r => r.json()).then(lista => {
                cont.innerHTML = "";
                lista.forEach(item => {
                    var estado = item.pagado ? "pagado" : (item.url_rev ? "esperando-pago" : "pendiente");
                    var notaHtml = item.notas ? `<div style="font-size:12px; color:#555; margin-top:5px; border-top:1px dashed #eee;">📝 ${item.notas}</div>` : "";
                    cont.innerHTML += `<div class="card ${estado}">
                        <div style="font-weight:bold;">${item.nombre}</div>
                        <div style="font-family:monospace; font-size:14px;">${item.pedido}</div>
                        <div>Vendedor: ${item.contacto} | ${item.precio}€</div>
                        ${notaHtml}
                        <div style="font-size:11px; text-align:right;">Alta: ${item.f_alta}</div>
                    </div>`;
                });
            });
        }
        
        // (Resto de funciones: enviarNuevo, cargarVendedores, etc... se mantienen igual)
        // RECUERDA: Implementar siempre con "Nueva Versión" tras pegar el código.
    </script>
</body>
</html>
