<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Reviews</title>
    
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        body { font-family: sans-serif; background-color: #f4f7f6; padding: 20px; max-width: 600px; margin: 0 auto; }
        
        .contenedor-principal { text-align: center; } /* Para centrar logo y titulo */
        
        /* Estilo para tu LOGO */
        .mi-logo {
    max-width: 150px;
    height: auto;
    margin-bottom: 10px;
    /* Esta línea intenta mezclar el blanco del logo con el fondo de la web */
    mix-blend-mode: multiply; 
}

        h2 { color: #333; margin-top: 5px; }
        
        .grupo-input { margin-bottom: 15px; text-align: left; } /* Los inputs alineados a la izq */
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        textarea { height: 80px; resize: vertical; }

        .botones { display: flex; gap: 10px; margin-top: 20px; }
        
        button { flex: 1; padding: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; color: white; }
        .btn-guardar { background-color: #28a745; } 
        .btn-copiar { background-color: #007bff; } 
        
        button:active { opacity: 0.8; }
        #mensaje { text-align: center; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="contenedor-principal">
        <img src="logo.png" alt="Logo" class="mi-logo">
        
        <h2>📦 Nueva Review</h2>
    </div>

    <div class="grupo-input">
        <label>Producto:</label>
        <input type="text" id="nombre">
    </div>

    <div class="grupo-input">
        <label>Nº Pedido:</label>
        <input type="text" id="pedido">
    </div>

    <div class="grupo-input">
        <label>URL Pedido:</label>
        <input type="url" id="url_pedido">
    </div>

    <div class="grupo-input">
        <label>Contacto Vendedor:</label>
        <input type="text" id="contacto">
    </div>

    <div class="grupo-input">
        <label>Precio:</label>
        <input type="number" step="0.01" id="precio">
    </div>

    <div class="grupo-input">
        <label>Fecha Review:</label>
        <input type="date" id="fecha">
    </div>

    <div class="grupo-input">
        <label>URL Review:</label>
        <input type="url" id="url_review">
    </div>

    <div class="grupo-input">
        <label>Notas / Comentarios:</label>
        <textarea id="notas"></textarea>
    </div>

    <div class="botones">
        <button class="btn-guardar" onclick="enviar()">💾 Guardar</button>
        <button class="btn-copiar" onclick="copiar()">📋 Copiar Info</button>
    </div>

    <p id="mensaje"></p>

    <script>
        // --- 🔴 PEGA TU URL DE APPS SCRIPT AQUÍ 🔴 ---
        var scriptURL = "https://script.google.com/macros/s/AKfycbzdPyE77gPyvIh49rup9ajOZRl5cVpstLj0Ud7FpUAkbECYKHlyeBrGsVbAqNESGP7vtQ/exec"; 
        // ---------------------------------------------

        function enviar() {
            var msj = document.getElementById("mensaje");
            msj.innerText = "⏳ Enviando...";

            var datos = new FormData();
            datos.append("nombre", document.getElementById("nombre").value);
            datos.append("pedido", document.getElementById("pedido").value);
            datos.append("url_pedido", document.getElementById("url_pedido").value);
            datos.append("contacto", document.getElementById("contacto").value);
            datos.append("precio", document.getElementById("precio").value);
            datos.append("fecha", document.getElementById("fecha").value);
            datos.append("url_review", document.getElementById("url_review").value);
            datos.append("notas", document.getElementById("notas").value);

            fetch(scriptURL, { method: 'POST', body: datos })
            .then(response => {
                msj.innerText = "✅ ¡Guardado!";
                setTimeout(() => msj.innerText = "", 3000);
            })
            .catch(error => {
                msj.innerText = "⚠️ Error (verifica la hoja).";
            });
        }

        function copiar() {
            var pedido = document.getElementById("pedido").value;
            var urlRev = document.getElementById("url_review").value;
            var miPaypal = "elisagundinmorales@gmail.com";

            var textoACopiar = "Pedido: " + pedido + "\n" +
                               "Review: " + urlRev + "\n" +
                               "PayPal: " + miPaypal;

            navigator.clipboard.writeText(textoACopiar).then(() => {
                alert("✅ Copiado:\n\n" + textoACopiar);
            }).catch(err => {
                alert("❌ Error al copiar");
            });
        }
    </script>

</body>
</html>
